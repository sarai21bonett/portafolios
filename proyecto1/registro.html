<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="registro.css">
</head>

<body>

    <form id="loginForm" onsubmit="return validateForm()">
        <h2>Login</h2>

        <label for="username">Nombre</label>
        <input type="text" id="username" required onfocus="changeclr1()" onblur="changeclr2(); convertToUppercase(this)">

        <label for="password">Contraseña</label>
        <input type="password" id="password" required onfocus="changeclr3()" onblur="changeclr4(); convertToUppercase(this)">

        <label for="email">Gmail</label>
        <input type="email" id="email" required onfocus="changeclr5()" onblur="changeclr6(); convertToUppercase(this)">

        <div class="registrarse">
            No tienes cuenta? <a href="registro.html">¡Regístrate!</a>
        </div>
        <button type="submit" class="boton">Iniciar</button>
    </form> 

    <p id="hora"></p>

    <div class="alerta">
        <input type="button" onclick="alerta()" value="Información.">
        <input type="button" onclick="alerta1()" value="Datos.">
    </div>

    <script src="principal.js"></script> <!-- Asegúrate de que este archivo esté en la misma carpeta -->
</body>
</html>
