<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>

    <form>
        <h2>REGISTRO</h2>

        <label for="username">Nombre y apellido</label>
        <input type="text" id="username" onfocus="changeclr1()" onblur="changeclr2(); convertToUppercase(this)">

        <label for="password">Contraseña</label>
        <input type="password" id="password" onfocus="changeclr3()" onblur="changeclr4(); convertToUppercase(this)">

        <label for="email">Gmail</label>
        <input type="email" id="email" onfocus="changeclr5()" onblur="changeclr6(); convertToUppercase(this)">

        <button type="submit" class="boton">Iniciar</button>
        
    </form>
    
    <script src="formulario.js"></script>
    <p id="hora"></p> 

</body>
</html>
