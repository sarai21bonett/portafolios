
<!DOCTYPE html>

<body>

    <header>
        <div class="content">
            <div class="menu container">

                    </ul>

    </header>

    <div class="contenido">
        <form id="encuestaForm">
            <section id="p0">
                <h3>¿Qué opinas de la cultura japonesa?</h3>
                <label>
                    <input type="radio" value="me gusta" name="p0"> Me gusta.
                </label>
                <label>
                    <input type="radio" value="normal" name="p0"> Normal.
                </label>
                <label>
                    <input type="radio" value="no me gusta" name="p0"> No me gusta.
                </label>
            </section>

            <section id="p1">
                <h3>¿Te gustaría visitar Japón?</h3>
                <label>
                    <input type="radio" value="si" name="p1"> Sí
                </label>
                <label>
                    <input type="radio" value="tal vez" name="p1"> Tal vez algún día
                </label>
                <label>
                    <input type="radio" value="no" name="p1"> No
                </label>
            </section>

            <section id="p2">
                <h3>¿Cuántas veces comen los japoneses al día?</h3>
                <label>
                    <input type="radio" value="2 veces" name="p2"> 2 veces
                </label>
                <label>
                    <input type="radio" value="3 veces" name="p2"> 3 veces
                </label>
                <label>
                    <input type="radio" value="1 vez" name="p2"> 1 vez
                </label>
                <label>
                    <input type="radio" value="4 veces" name="p2"> 4 veces
                </label>
            </section>

            <!-- Botón de enviar -->
            <button type="submit" class="boton">Enviar</button>
        </form>
    </div>

</body>
